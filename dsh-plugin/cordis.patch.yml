- insert:
    - id: agentbridge-hostmcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: hostmcp
        transport: stdio
        command: python
        args: ['-m', 'host_mcp', '--transport', 'stdio']
        cwd: !!js "process.env.DSH_PROFILE_DIR + '/node_modules/@local/agentbridge/runtime/copilot_backend'"
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
          PYTHONPATH: !!js "process.env.DSH_PROFILE_DIR + '/node_modules/@local/agentbridge/runtime'"
        startupTimeoutMs: 30000
        failOnStartupError: false
    - id: agentbridge-cadmcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: cadmcp
        transport: stdio
        command: python
        args: ['-m', 'cadmcp', '--transport', 'stdio']
        cwd: !!js "process.env.DSH_PROFILE_DIR + '/node_modules/@local/agentbridge/runtime/copilot_backend'"
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
          PYTHONPATH: !!js "process.env.DSH_PROFILE_DIR + '/node_modules/@local/agentbridge/runtime'"
        startupTimeoutMs: 30000
        failOnStartupError: false
    - id: agentbridge-control
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: agentbridge
        transport: stdio
        command: python
        args: ['-m', 'control_mcp']
        cwd: !!js "process.env.DSH_PROFILE_DIR + '/node_modules/@local/agentbridge/runtime/copilot_backend'"
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
          PYTHONPATH: !!js "process.env.DSH_PROFILE_DIR + '/node_modules/@local/agentbridge/runtime'"
        startupTimeoutMs: 30000
        failOnStartupError: false
