name: Contract and build CI

on:
  push:
  pull_request:

jobs:
  python-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build ruff pytest pytest-asyncio
      - run: python -m pip install -e .
      - run: python -m pip install -r copilot_backend/requirements.txt
      - run: python -m pytest copilot_backend/tests -q
      - run: python -m ruff check cadmcp copilot_backend scripts
      - run: python -m build --wheel
      - shell: bash
        run: python scripts/verify_cadmcp_wheel.py "$(ls dist/cadmcp-*.whl | head -1)"

  mcp-stdio-handshake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python scripts/test_mcp_stdio_handshake.py

  dotnet-unit-build:
    runs-on: [self-hosted, windows, autocad-2024]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore AgentBridge.sln
      - run: dotnet build AgentBridge.sln -c Release --no-restore
      - run: .\AgentBridge.Tests\bin\Release\net48\AgentBridge.Tests.exe
