[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cadmcp"
version = "0.2.0"
description = "Standalone MCP server and transactional AutoCAD bridge client for AgentBridge"
readme = "cadmcp/README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.28,<0.29",
  "mcp[cli]>=1.27,<2",
]

[project.scripts]
cadmcp = "cadmcp.server:main"

[tool.setuptools.packages.find]
include = ["cadmcp*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["copilot_backend/tests"]
